# dsh-enter-newline bundle patch
#
# This file is the `dsh.bundle.patch` layer of the package: when the plugin is
# installed through the official CLI
#
#   dsh plugin --profile web add dsh-enter-newline@<version>
#
# the command reconciles `dsh.profile.bundles` against installed packages and,
# seeing this declaration, appends `dsh-enter-newline` to the bundle stack.
# Profile boot then merges THIS patch (a single `insert` of the plugin row)
# exactly like a manual cordis.patch.yml mount line. No profile file edits
# needed — one command installs and mounts.
#
# `name` MUST equal the package name: the client-modules host scan resolves
# `require.resolve("<name>/package.json")` to read the `dsh.client` declaration.
- insert:
    - id: dsh-enter-newline
      name: 'dsh-enter-newline'
